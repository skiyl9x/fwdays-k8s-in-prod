apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: student03
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student03
  namespace: student03
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student03-writer
  namespace: student03
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - configmaps
  - secrets
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student03-writer
  namespace: student03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: student03-writer
subjects:
- kind: ServiceAccount
  name: student03
  namespace: student03
