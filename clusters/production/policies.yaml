# Layer 2: Cluster-wide guardrails (Kyverno policies), need the Kyverno CRDs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1m
  path: ./policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: rendered-production
  wait: true
