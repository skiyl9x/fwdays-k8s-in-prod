# Layer 1: The "Engine" (Operators, CRDs, HelmRepos)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1m
  # Point to a specific folder containing ALL operator overlays
  path: ./infrastructure/controllers 
  prune: true
  sourceRef:
    kind: GitRepository
    name: rendered-production
  # This ensures Flux waits until the APIs are actually usable
  wait: true 
