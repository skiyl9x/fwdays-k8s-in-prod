# Layer: tenants (namespaces, ServiceAccounts and RBAC for mentor and students)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  interval: 1m
  path: ./tenants
  prune: true
  sourceRef:
    kind: GitRepository
    name: rendered-production
  wait: true
