name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.9.6
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@v0.15.0
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@v0.15.0
        with:
          path: '.'
          config: '.fluxschema.yaml'
      - name: Validate API versions
        run: |
          flux migrate -f . --yes
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'deprecated API versions found, run flux migrate and commit changes'
            exit 1
          fi
