# Alloy collects pod logs and Kubernetes events and sends them to Loki
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1h
  # Loki must be running before Alloy starts pushing logs
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: "1.15.0"         # Alloy v1.21.3
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    controller:
      type: daemonset
    alloy:
      # mount /var/log from the node, pod logs are in /var/log/pods
      mounts:
        varlog: true
      configMap:
        content: |
          // Pod logs from /var/log/pods
          discovery.kubernetes "pods" {
            role = "pod"
          }
    
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
    
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            // app = app.kubernetes.io/name, or the app label if it is not set
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
              separator     = ";"
              regex         = "^;*([^;]+).*$"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }
    
          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }
    
          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }
    
          // containerd (k3s) log format: time, stream, flags, message
          loki.process "pods" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }
    
          // Kubernetes events, e.g. Kyverno PolicyViolation
          loki.source.kubernetes_events "events" {
            job_name   = "kubernetes-events"
            log_format = "json"
            forward_to = [loki.write.default.receiver]
          }
    
          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }
