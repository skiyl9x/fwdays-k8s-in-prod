apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "67.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: [ "/metadata/annotations/prometheus-operator-validated" ]
        target:
          kind: PrometheusRule
  valuesFrom:
  - kind: ConfigMap
    name: flux-kube-state-metrics-config
    valuesKey: kube-state-metrics-config.yaml

  values:
    # Grafana Configuration
    grafana:
      enabled: true
      defaultDashboardsEnabled: false
      persistence:
        enabled: true
        size: 5Gi
      adminPassword: "prom-operator" # Change this or use a Secret!
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc:3100
          access: proxy 
    # Prometheus Configuration
    prometheus:
      prometheusSpec:
        # This ensures the volume is writable by the prometheus user (UID 65534)
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          runAsNonRoot: true
        retention: 10d
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # If your storage provider (like some NFS or Local Path) is stubborn, 
        # use the built-in initContainer to force the fix:
  #      initContainers:
  #        - name: init-chmod-data
  #          image: busybox:latest
  #          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
  #          securityContext:
  #            # These three fields are the "keys" to enabling root
  #            runAsUser: 0
  #            runAsNonRoot: false
  #            allowPrivilegeEscalation: true
  #          volumeMounts:
  #            - name: prometheus-kube-prometheus-stack-prometheus-db
  #             mountPath: /prometheus

    alertmanager:
      enabled: true
