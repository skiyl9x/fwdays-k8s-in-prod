apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  chart:
    spec:
      chart: fwdays-kyverno-policies
      sourceRef:
        kind: HelmRepository
        name: skiyl9x-helm-charts
        namespace: flux-system
      version: 0.2.0
  interval: 1m
  values:
    personLabel:
      key: person
      persons:
        mentor:
          namespaces:
          - mentor
        student:
          namespaces:
          - student01
          - student02
          - student03
    policies:
      addPersonLabel:
        enabled: true
      forbidPersonLabel:
        background: true
        enabled: true
        failureAction: Enforce
      injectIstioSidecar:
        enabled: true
        persons:
        - student
      requireReadonlyRootfs:
        background: true
        enabled: true
        failureAction: Audit
