apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 1m
  chart:
    spec:
      chart: fwdays-kyverno-policies
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: skiyl9x-helm-charts
        namespace: flux-system
  # Default values
  # https://github.com/skiyl9x/helm-charts/blob/main/charts/fwdays-kyverno-policies/values.yaml
  values:
    personLabel:
      key: person
      persons:
        mentor:
          namespaces: [mentor]
        student:
          namespaces: [student01, student02, student03]

    policies:
      requireReadonlyRootfs:
        enabled: true
        failureAction: Audit      # Audit | Enforce
        background: true
      addPersonLabel:
        enabled: true
      forbidPersonLabel:
        enabled: true
        failureAction: Enforce    # Audit | Enforce
        background: true