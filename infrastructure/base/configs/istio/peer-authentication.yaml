# Mesh-wide mTLS: a PeerAuthentication in the root namespace (istio-system) applies to every
# workload with a sidecar. STRICT rejects plain-text traffic from clients outside the mesh.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
