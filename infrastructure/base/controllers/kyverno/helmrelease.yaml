apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  releaseName: kyverno
  targetNamespace: kyverno
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kyverno
      version: "3.9.1"          # Kyverno v1.19.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
