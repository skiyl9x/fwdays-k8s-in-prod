# Istio control plane: injects the istio-proxy sidecar into pods of labelled namespaces
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 1h
  releaseName: istiod
  targetNamespace: istio-system
  # the CRDs from istio-base must exist before istiod starts
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.30.6"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
  values:
    pilot:
      # single-node k3s cluster
      autoscaleEnabled: false
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    global:
      proxy:
        # inject only into pods that ask for it (sidecar.istio.io/inject: "true")
        autoInject: disabled
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
    meshConfig:
      accessLogFile: /dev/stdout
    sidecarInjectorWebhook:
      # send every pod to the injector, so it sees pods that Kyverno marks for injection
      enableNamespacesByDefault: true
      # call the injector again after Kyverno (its webhook runs later) has mutated the pod
      reinvocationPolicy: IfNeeded
