apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  chart:
    spec:
      chart: base
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
      version: 1.30.6
  install:
    crds: CreateReplace
  interval: 1h
  releaseName: istio-base
  targetNamespace: istio-system
  upgrade:
    crds: CreateReplace
  values:
    defaultRevision: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  chart:
    spec:
      chart: istiod
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
      version: 1.30.6
  dependsOn:
  - name: istio-base
  interval: 1h
  releaseName: istiod
  targetNamespace: istio-system
  values:
    global:
      proxy:
        autoInject: disabled
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
    meshConfig:
      accessLogFile: /dev/stdout
    pilot:
      autoscaleEnabled: false
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    sidecarInjectorWebhook:
      enableNamespacesByDefault: true
      reinvocationPolicy: IfNeeded
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: istio-system
spec:
  interval: 1h
  url: https://istio-release.storage.googleapis.com/charts
