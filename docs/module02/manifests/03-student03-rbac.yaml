---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student03-writer
  namespace: student03
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student03-writer
  namespace: student03
subjects:
  - kind: ServiceAccount
    name: student03
    namespace: student03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: student03-writer
